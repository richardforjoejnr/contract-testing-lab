# Local development broker. Anonymous access, no TLS, no persistence.
#
# Production MQTT looks nothing like this — mutual TLS, per-device
# credentials, ACLs restricting each controller to its own topic subtree.
# None of that is exercised by the contract tests, which is the point being
# made in ADR-004: message pacts verify payloads, not transport or auth.
listener 1883
allow_anonymous true

# WebSocket listener, handy for poking at the broker from a browser client.
listener 9001
protocol websockets

persistence false
log_dest stdout
log_type warning
log_type notice
