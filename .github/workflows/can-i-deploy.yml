# The deployment gate.
#
# This workflow is the whole argument for contract testing as an engineering
# control rather than a testing technique. Everything before it produces
# evidence; this is the step that refuses to ship when the evidence says no.
#
# The question is not "did the tests pass on my branch". It is: given every
# version of every participant currently running in <environment>, is THIS
# version safe to put next to them? A provider whose own suite is green can
# still be fatal to the consumer version that has been in production for three
# weeks, and nothing in the provider's repository knows that. The broker does.
#
# Deliberately separate from the provider workflow. Verification answers "are we
# compatible"; deploying answers "should this go out now" — different questions,
# different triggers, and in a real org often different permissions.

name: can-i-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to check against
        type: choice
        options: [production, staging]
        default: production
      participant:
        description: Single participant to check (blank = all four)
        type: string
        default: ''
  # Chained off the provider build so the gate runs against fresh verification
  # results rather than whatever happened to be in the broker this morning.
  workflow_run:
    workflows: [provider]
    types: [completed]
    branches: [main]

concurrency:
  group: can-i-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: can-i-deploy → ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # No broker means no gate. Being explicit about that is the point: a gate
    # that silently passes when it cannot reach its source of truth is worse
    # than no gate, because people believe it.
    if: >-
      ${{ vars.PACT_BROKER_BASE_URL != '' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.workflow_run.conclusion == 'success') }}

    env:
      PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
      ENVIRONMENT: ${{ inputs.environment || 'production' }}
      PACT_DO_NOT_TRACK: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ensure environments exist
        run: ./scripts/create-environments.sh

      # Providers first, consumers second, and the ordering is the whole point.
      #
      # A consumer that adds an interaction changes its pact's *content*, which
      # makes it a new pact version. The provider currently in production has
      # never been verified against that version, so the gate refuses the
      # consumer — correctly, and confusingly if you were expecting one atomic
      # release. Gating all four together and deploying them in one step only
      # works while pact content never changes, which is to say: until the
      # first interesting commit.
      #
      # Rolling the provider out first is not a workaround for the gate. It is
      # what a backward-compatible change actually requires, and the gate is
      # the thing that stops you doing it in the wrong order by accident.
      #
      # Each phase records its deployments before the next phase is gated, so
      # the consumer check reasons about the providers this run just shipped.

      # --- Phase 1: providers ------------------------------------------------
      - name: can-i-deploy → providers
        if: ${{ !inputs.participant }}
        run: |
          source ./scripts/_common.sh
          for participant in "${PROVIDERS[@]}"; do
            ./scripts/can-i-deploy.sh "$participant" "$ENVIRONMENT"
          done

      # Recording happens only after the deploy it describes. Recording it
      # beforehand would tell the broker something untrue the moment a deploy
      # fails, and every later can-i-deploy would reason from that lie.
      #
      # Skipping it entirely is the most common way a working setup rots:
      # can-i-deploy quietly stops having anything to compare against.
      - name: Deploy and record providers
        if: ${{ !inputs.participant }}
        run: |
          source ./scripts/_common.sh
          echo "Deploying providers $(git rev-parse --short=12 HEAD) to $ENVIRONMENT"
          echo "(mock — this repo has nothing to deploy)"
          for participant in "${PROVIDERS[@]}"; do
            ./scripts/record-deployment.sh "$participant" "$ENVIRONMENT"
          done

      # --- Phase 2: consumers ------------------------------------------------
      - name: can-i-deploy → consumers
        if: ${{ !inputs.participant }}
        run: |
          source ./scripts/_common.sh
          for participant in "${CONSUMERS[@]}"; do
            ./scripts/can-i-deploy.sh "$participant" "$ENVIRONMENT"
          done

      - name: Deploy and record consumers
        if: ${{ !inputs.participant }}
        run: |
          source ./scripts/_common.sh
          echo "Deploying consumers $(git rev-parse --short=12 HEAD) to $ENVIRONMENT"
          echo "(mock — this repo has nothing to deploy)"
          for participant in "${CONSUMERS[@]}"; do
            ./scripts/record-deployment.sh "$participant" "$ENVIRONMENT"
          done

      # --- One participant, by hand ------------------------------------------
      # The workflow_dispatch escape hatch, and the thing to reach for when a
      # phase above has blocked and you need to ship one side on its own.
      - name: can-i-deploy → ${{ inputs.participant }}
        if: ${{ inputs.participant }}
        run: |
          ./scripts/can-i-deploy.sh "${{ inputs.participant }}" "$ENVIRONMENT"
          echo "Deploying ${{ inputs.participant }} $(git rev-parse --short=12 HEAD) to $ENVIRONMENT"
          ./scripts/record-deployment.sh "${{ inputs.participant }}" "$ENVIRONMENT"

  explain-skip:
    name: gate skipped
    runs-on: ubuntu-latest
    if: ${{ vars.PACT_BROKER_BASE_URL == '' }}
    steps:
      - name: Explain
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### No deployment gate on this repository

          `can-i-deploy` needs a broker that outlives the build, and no
          `PACT_BROKER_BASE_URL` repository variable is set.

          To see the gate actually engage — including it blocking — run
          `pnpm broker:up && pnpm loop` locally, or look at the
          `contract tests` workflow, which runs the full sequence twice against
          a throwaway broker so the second pass has recorded deployments to
          reason about.
          EOF
